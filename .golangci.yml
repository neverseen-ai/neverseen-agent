version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
    - usestdlibvars

  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck

    misspell:
      # British spelling throughout: the product targets the UK and the EU, and
      # its prose says "catalogue", "licence", "recognised". Set here rather
      # than corrected in the comments, so the linter agrees with a choice that
      # was made deliberately.
      locale: UK
      ignore-rules:
        # "color" is a CSS property name, not prose, and the test page's
        # stylesheet is full of it. It cannot be spelled the other way.
        - color
        # French month names written without their accents, which is what a
        # keyboard with no compose key produces and a form field therefore
        # receives. The sample shows them on purpose, and an English
        # spellchecker reads them as misspelt English months.
        - aout
        - fevrier
        - decembre

    errcheck:
      # A failed write to stdout — a closed pipe, mostly — leaves a CLI nothing
      # useful to do but exit, which it is about to do anyway. Checking each
      # Fprintln in a report that prints a dozen lines buys nothing and hides
      # the shape of the report.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

  exclusions:
    rules:
      # A test may assert on a value the linter would rather see refactored.
      - path: _test\.go
        linters:
          - unparam
          - gocritic

      # internal/service dispatches to launchctl, systemctl or schtasks — one
      # per build-tagged file, sharing one `run` helper. The linter analyses a
      # single GOOS at a time, so it only ever sees that helper called with one
      # command name and reports the parameter as constant. It is wrong on every
      # platform, and it is wrong differently on each.
      - path: internal/service/
        linters:
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
