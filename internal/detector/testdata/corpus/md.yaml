# Moldova suite. For now the licence plate alone, read only behind a word naming a
# vehicle, so the same plate with no word in front must come out untouched.
#
# No plate here carries a check character; the shape, the country's letters and
# the zero number no series issues are what the pattern has.
locale: md
min_precision: 100
min_recall: 100

cases:
  - id: md-plate-1
    text: "înmatriculare ABC 123 — noted."
    expect:
      - {category: LICENSE_PLATE, value: "ABC 123"}

  - id: md-plate-2
    text: "înmatriculare KLM456 — noted."
    expect:
      - {category: LICENSE_PLATE, value: "KLM456"}

  - id: md-prec-no-word
    text: "Reference ABC 123 — noted."
    expect: []
