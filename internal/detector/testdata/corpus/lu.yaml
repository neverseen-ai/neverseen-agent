# Luxembourg suite. For now the licence plate alone, read only behind a word naming
# a vehicle, so the same plate with no word in front must come out untouched.
#
# No plate here carries a check character; the shape, the country's letters and
# the zero number no series issues are what the pattern has.
locale: lu
min_precision: 100
min_recall: 100

cases:
  - id: lu-plate-1
    text: "plaque AB 1234 — noted."
    expect:
      - {category: LICENSE_PLATE, value: "AB 1234"}

  - id: lu-plate-2
    text: "plaque CD 567 — noted."
    expect:
      - {category: LICENSE_PLATE, value: "CD 567"}

  - id: lu-prec-no-word
    text: "Reference AB 1234 — noted."
    expect: []
