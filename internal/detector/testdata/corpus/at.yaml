# Austria suite. For now the licence plate alone, read only behind a word naming a
# vehicle, so the same plate with no word in front must come out untouched.
#
# No plate here carries a check character; the shape, the country's letters and
# the zero number no series issues are what the pattern has.
locale: at
min_precision: 100
min_recall: 100

cases:
  - id: at-plate-1
    text: "Kennzeichen W 12345 B — noted."
    expect:
      - {category: LICENSE_PLATE, value: "W 12345 B"}

  - id: at-plate-2
    text: "Kennzeichen BN 123 AB — noted."
    expect:
      - {category: LICENSE_PLATE, value: "BN 123 AB"}

  - id: at-prec-no-word
    text: "Reference W 12345 B — noted."
    expect: []

  - id: at-prec-1
    text: "Siehe ÖNORM B 1300 und EN 12345."
    expect: []
