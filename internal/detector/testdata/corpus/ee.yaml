# Estonia suite. For now the licence plate alone, read only behind a word naming a
# vehicle, so the same plate with no word in front must come out untouched.
#
# No plate here carries a check character; the shape, the country's letters and
# the zero number no series issues are what the pattern has.
locale: ee
min_precision: 100
min_recall: 100

cases:
  - id: ee-plate-1
    text: "numbrimärk 123 ABC — noted."
    expect:
      - {category: LICENSE_PLATE, value: "123 ABC"}

  - id: ee-plate-2
    text: "numbrimärk 456DEF — noted."
    expect:
      - {category: LICENSE_PLATE, value: "456DEF"}

  - id: ee-prec-no-word
    text: "Reference 123 ABC — noted."
    expect: []
