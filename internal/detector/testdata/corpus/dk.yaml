# Denmark suite. For now the licence plate alone, read only behind a word naming a
# vehicle, so the same plate with no word in front must come out untouched.
#
# No plate here carries a check character; the shape, the country's letters and
# the zero number no series issues are what the pattern has.
locale: dk
min_precision: 100
min_recall: 100

cases:
  - id: dk-plate-1
    text: "nummerplade AB 12 345 — noted."
    expect:
      - {category: LICENSE_PLATE, value: "AB 12 345"}

  - id: dk-plate-2
    text: "nummerplade CD67890 — noted."
    expect:
      - {category: LICENSE_PLATE, value: "CD67890"}

  - id: dk-plate-3
    text: "nummerplade EF 23456 — noted."
    expect:
      - {category: LICENSE_PLATE, value: "EF 23456"}

  - id: dk-plate-4
    text: "nummerplade GH-34-567 — noted."
    expect:
      - {category: LICENSE_PLATE, value: "GH-34-567"}

  - id: dk-prec-postcode
    text: "Ship to DK 28000 by Friday."
    expect: []

  - id: dk-prec-no-word
    text: "Reference AB 12 345 — noted."
    expect: []

  - id: dk-plate-reg
    text: "Reg AB 12 345 — noted."
    expect:
      - {category: LICENSE_PLATE, value: "AB 12 345"}

  - id: dk-prec-word-that-opens-on-plate
    text: "The plateau AB 12 345 holds the site."
    expect: []
