# Bosnia and Herzegovina suite. For now the licence plate alone, read on its own.
#
# No plate here carries a check character; the shape, the country's letters and
# the zero number no series issues are what the pattern has.
locale: ba
min_precision: 100
min_recall: 100

cases:
  - id: ba-plate-1
    text: "registarsk A12-K-345 — noted."
    expect:
      - {category: LICENSE_PLATE, value: "A12-K-345"}

  - id: ba-plate-2
    text: "registarsk E67-J-890 — noted."
    expect:
      - {category: LICENSE_PLATE, value: "E67-J-890"}
