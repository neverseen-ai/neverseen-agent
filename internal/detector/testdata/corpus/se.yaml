# Sweden suite. For now the licence plate alone, read only behind a word naming a
# vehicle, so the same plate with no word in front must come out untouched.
#
# No plate here carries a check character; the shape, the country's letters and
# the zero number no series issues are what the pattern has.
locale: se
min_precision: 100
min_recall: 100

cases:
  - id: se-plate-1
    text: "registreringsnummer ABC 123 — noted."
    expect:
      - {category: LICENSE_PLATE, value: "ABC 123"}

  - id: se-plate-2
    text: "registreringsnummer DEF 45G — noted."
    expect:
      - {category: LICENSE_PLATE, value: "DEF 45G"}

  - id: se-prec-no-word
    text: "Reference ABC 123 — noted."
    expect: []

  - id: se-prec-1
    text: "Se ISO 639 och RFC 822."
    expect: []
