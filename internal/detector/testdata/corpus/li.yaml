# Liechtenstein suite. For now the licence plate alone, read only behind a word
# naming a vehicle, so the same plate with no word in front must come out untouched.
#
# No plate here carries a check character; the shape, the country's letters and
# the zero number no series issues are what the pattern has.
locale: li
min_precision: 100
min_recall: 100

cases:
  - id: li-plate-1
    text: "Kontrollschild FL 12345 — noted."
    expect:
      - {category: LICENSE_PLATE, value: "FL 12345"}

  - id: li-plate-2
    text: "Kontrollschild FL 678 — noted."
    expect:
      - {category: LICENSE_PLATE, value: "FL 678"}

  - id: li-prec-no-word
    text: "Reference FL 12345 — noted."
    expect: []
