# Locale-independent suite: the patterns that stay on whatever VEIL_PII_LOCALE
# says. Run with locale "none" so no country set can claim a span first.
locale: none
min_precision: 100
min_recall: 100

cases:
  - id: intl-credit-cards
    text: "Payé avec la carte 4532015112830366, puis remboursé sur 5425233430109903."
    expect:
      - {category: CREDIT_CARD, value: "4532015112830366"}
      - {category: CREDIT_CARD, value: "5425233430109903"}

  - id: intl-iban-de-be
    text: "Comptes DE89370400440532013000 et BE68539007547034 à rapprocher."
    expect:
      - {category: IBAN, value: "DE89370400440532013000"}
      - {category: IBAN, value: "BE68539007547034"}

  # A currency glued to the account with no space to cut on. The expression has
  # to tolerate it — an alphanumeric body cannot exclude three more letters —
  # so the checksum is what finds where the account ends, one character at a
  # time. Without that refinement the over-long span fails the key, the match is
  # discarded, and the account goes out in clear.
  - id: intl-iban-glued-currency
    text: "Settled DE89370400440532013000EUR on Tuesday."
    expect:
      - {category: IBAN, value: "DE89370400440532013000"}

  - id: intl-ipv4-in-log
    text: "connection refused from 192.168.13.42 after three retries"
    expect:
      - {category: IP_ADDRESS, value: "192.168.13.42"}

  # The IBAN is the one national-looking identifier that belongs here: one
  # expression and one checksum cover every issuing country, so a deployment
  # scanning no country's data still masks the account.
  - id: intl-iban-nl-es
    text: "Also reconcile NL91ABNA0417164300 and ES9121000418450200051332 this week."
    expect:
      - {category: IBAN, value: "NL91ABNA0417164300"}
      - {category: IBAN, value: "ES9121000418450200051332"}

  - id: intl-mongo-id
    text: "db.users.findOne({_id: ObjectId('507f1f77bcf86cd799439011')})"
    expect:
      - {category: MONGO_ID, value: "507f1f77bcf86cd799439011"}

  - id: intl-dob
    text: "Born 1987-03-14, first contract signed later that year."
    expect:
      - {category: DOB, value: "1987-03-14"}

  - id: intl-secrets-mixed
    text: "export OPENAI_API_KEY=sk-proj-abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGH and GITHUB_TOKEN=ghp_abcdefghijklmnopqrstuvwxyz0123456789"
    expect:
      - {category: SECRET_OPENAI_KEY, value: "sk-proj-abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGH"}
      - {category: SECRET_GITHUB_TOKEN, value: "ghp_abcdefghijklmnopqrstuvwxyz0123456789"}

  - id: intl-conn-str-postgres
    text: "Déploiement avec DATABASE_URL=postgres://admin:s3cr3t@db.example.com:5432/app hier."
    expect:
      - {category: SECRET_CONN_STR, value: "admin:s3cr3t@db.example.com:5432/app"}

  - id: intl-conn-str-redis-empty-user
    text: "Cache sur redis://:p4ssonly@redis.internal:6379 en prod."
    expect:
      - {category: SECRET_CONN_STR, value: ":p4ssonly@redis.internal:6379"}

  - id: intl-conn-str-https-basic-auth
    text: "L'API partenaire répond sur https://user:p4ss@api.partner.com/v1/orders directement."
    expect:
      - {category: SECRET_CONN_STR, value: "user:p4ss@api.partner.com/v1/orders"}

  - id: intl-aws-key
    text: "aws_access_key_id = AKIAIOSFODNN7EXAMPLE"
    expect:
      - {category: SECRET_AWS_ACCESS_KEY, value: "AKIAIOSFODNN7EXAMPLE"}

  # ISO, and in the future. The rule guards all three date patterns at once,
  # because Verify hangs off the category rather than off a pattern.
  - id: intl-prec-dob-future
    text: "Support ends 2099-12-31 per the published schedule."
    expect: []

  # A short git object id, masked as a bank account before the per-country length
  # was checked. It opens on "AE", which is a real country code, and its mod-97 key
  # happens to verify — one arbitrary string in ninety-seven does. An Emirati IBAN
  # is twenty-three characters; this is sixteen.
  - id: intl-prec-hex-blob-is-not-an-iban
    text: "Le cache porte l'objet ae5917ce58a7f1e2 depuis le dernier build."
    expect: []

  # Fourteen digits opening on a 4, and it passes Luhn — a tenth of arbitrary runs
  # do. No Visa card has ever had fourteen digits, so before the shape fixed the
  # length this was masked as a payment card.
  - id: intl-prec-fourteen-digits-is-not-a-card
    text: "La référence interne 43333333333338 figure au bordereau."
    expect: []

  # A nineteen-digit Visa, in both the notations the pattern accepts. This was the
  # last gap in the card shape and it was a miss — a real card forwarded in clear,
  # which is the worse direction than a reference masked for nothing.
  - id: intl-card-nineteen-digits
    text: "Paiement avec la carte 4532015112830366120 hier soir."
    expect:
      - {category: CREDIT_CARD, value: "4532015112830366120"}

  - id: intl-card-nineteen-digits-grouped
    text: "La carte 4532 0151 1283 0366 120 a été refusée."
    expect:
      - {category: CREDIT_CARD, value: "4532 0151 1283 0366 120"}

  - id: intl-card-thirteen-digits
    text: "Ancienne carte 4222222222222 encore au dossier."
    expect:
      - {category: CREDIT_CARD, value: "4222222222222"}

  # --- IPv6 -----------------------------------------------------------------
  #
  # These exist because the shape did not. The category was labelled "IP address"
  # in every menu offering to switch it off, and only IPv4 was ever read — so an
  # operator who left it ticked believed their addresses were masked.

  - id: intl-ipv6-full
    text: "The host fd00:1234:5678:0000:0000:8a2e:0370:7334 stopped answering."
    expect:
      - {category: IPV6_ADDRESS, value: "fd00:1234:5678:0000:0000:8a2e:0370:7334"}

  - id: intl-ipv6-compressed
    text: "Route traffic to fd00:1234::1 for now."
    expect:
      - {category: IPV6_ADDRESS, value: "fd00:1234::1"}

  - id: intl-ipv6-compressed-middle
    text: "Peer fd00:1234:5678::8a2e:370:7334 is up."
    expect:
      - {category: IPV6_ADDRESS, value: "fd00:1234:5678::8a2e:370:7334"}

  # A MAC address is six groups and carries no "::", so neither branch can reach
  # it. It is the nearest shape to an address that is not one.
  - id: intl-prec-mac-address
    text: "Interface 00:1A:2B:3C:4D:5E came up on the switch."
    expect: []

  # A timestamp is the same characters in the same arrangement, three groups deep.
  - id: intl-prec-timestamp
    text: "Backup ran at 12:34:56 and finished at 01:02:03."
    expect: []

  # "abc::def" is a valid IPv6 address by every rule of the notation, and it is
  # also how C++ writes a namespace. Requiring two groups on one side of the "::"
  # is what keeps a prompt about source code from coming back with its identifiers
  # replaced — the lesson GenericSecretCheck already paid for.
  - id: intl-prec-cpp-namespace
    text: "The call was abc::def rather than std::vector<int> here."
    expect: []

  - id: intl-prec-ratio-and-range
    text: "Mixing ratio 1:2, port range 10:20:30 in the config."
    expect: []

  # --- ranges that can name nobody ------------------------------------------
  #
  # The catalogue declining to mask what it hands out. fakeGenerators mints
  # stand-ins from RFC 5737, RFC 3849 and RFC 2606 precisely because those ranges
  # are never routed and can never be registered — and until this rule existed the
  # detector claimed them back, so a documentation address in a comment was masked
  # and replaced by another address from the same block.
  #
  # Measured over hand-written application code, a third of every finding was of
  # this kind, and IP_ADDRESS — the largest category — was majority reserved.

  - id: intl-prec-loopback
    text: "The agent listens on 127.0.0.1:8787 by default."
    expect: []

  - id: intl-prec-unspecified
    text: "Binding 0.0.0.0:8787 serves every interface."
    expect: []

  - id: intl-prec-documentation-block
    text: "Point the client at 192.0.2.14 in the example above."
    expect: []

  - id: intl-prec-documentation-block-v6
    text: "The example uses 2001:db8:85a3::8a2e:370:7334 throughout."
    expect: []

  - id: intl-prec-reserved-email-domain
    text: "Write to support@example.com for the documented flow."
    expect: []

  - id: intl-prec-reserved-email-tld
    text: "The fixture uses admin@service.test and admin@host.invalid."
    expect: []

  # A private address is deliberately still masked. An internal host in a pasted
  # configuration is a topology, and a topology is exactly what should not reach a
  # model — localAddresses reports private addresses as this agent's own for the
  # same reason, and calling them noise here while reporting them there would be
  # two answers to one question.
  - id: intl-private-address-is-still-masked
    text: "The database sits at 10.4.2.17 behind the VPN."
    expect:
      - {category: IP_ADDRESS, value: "10.4.2.17"}

  # A registrable domain that merely looks like documentation. The rule is what
  # the standards reserve and no more: example.fr can be bought, so an address
  # there might belong to somebody.
  - id: intl-registrable-example-domain-is-masked
    text: "Contact claire.moreau@example.fr about the invoice."
    expect:
      - {category: EMAIL, value: "claire.moreau@example.fr"}
