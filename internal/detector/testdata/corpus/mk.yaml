# North Macedonia suite. For now the licence plate alone, read only behind a word
# naming a vehicle, so the same plate with no word in front must come out untouched.
#
# No plate here carries a check character; the shape, the country's letters and
# the zero number no series issues are what the pattern has.
locale: mk
min_precision: 100
min_recall: 100

cases:
  - id: mk-plate-1
    text: "номер SK 1234 AB — noted."
    expect:
      - {category: LICENSE_PLATE, value: "SK 1234 AB"}

  - id: mk-plate-2
    text: "номер BT 567 CD — noted."
    expect:
      - {category: LICENSE_PLATE, value: "BT 567 CD"}

  - id: mk-prec-no-word
    text: "Reference SK 1234 AB — noted."
    expect: []
