# Hungary suite. For now the licence plate alone, read on its own.
#
# No plate here carries a check character; the shape, the country's letters and
# the zero number no series issues are what the pattern has.
locale: hu
min_precision: 100
min_recall: 100

cases:
  - id: hu-plate-1
    text: "rendszám AA AB-123 — noted."
    expect:
      - {category: LICENSE_PLATE, value: "AA AB-123"}

  - id: hu-plate-2
    text: "rendszám AEAB456 — noted."
    expect:
      - {category: LICENSE_PLATE, value: "AEAB456"}

  - id: hu-prec-identifiers
    text: "Run test123, then item456 and demo123; HTTP200 came back for ABCD123."
    expect: []

  - id: hu-prec-ticket-key
    text: "Fixed in PROJ-123 and DATA-456 before the release."
    expect: []

  - id: hu-plate-old-named
    text: "A rendszám ABC-123 volt."
    expect:
      - {category: LICENSE_PLATE, value: "ABC-123"}

  - id: hu-prec-standards-in-code
    text: "import crypto/internal/fips140; see IEEE754 and ecma262 for the details."
    expect: []
