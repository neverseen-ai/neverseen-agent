# Credential suite: the vendor tokens and the named-value shapes, in the prose
# they actually arrive in — a paste into a support thread, a config excerpt, a
# stack trace attached to a ticket.
#
# It runs with locale "none" so no country pattern can claim a span first: a
# 10-digit run inside a token is a Vietnamese TIN with "vn" on, and the suite
# would then measure the collision rather than the credential.
#
# Every value here is fabricated and shaped to match, never a revoked real key.
# The vendor prefix is the part under test; the body is filler.
#
# The precision cases at the bottom carry the suite's weight. Recall alone
# cannot fail a credential pattern: one widened to match everything scores 100%
# recall and passes, and the generics — `NAME=value` and a run of hex — are
# exactly the shapes a config file, a commit SHA and a build id are full of. A
# case with an empty `expect` says the text must come out untouched.
locale: none
min_precision: 100
min_recall: 100

cases:
  - id: sec-anthropic
    text: "Le job échoue depuis que la clé sk-ant-api03-AbCdEfGhIjKlMnOpQrStUvWxYz0123456789 a été collée dans le ticket."
    expect:
      - {category: SECRET_ANTHROPIC_KEY, value: "sk-ant-api03-AbCdEfGhIjKlMnOpQrStUvWxYz0123456789"}

  - id: sec-google-gitlab
    text: "Deux jetons traînent dans le fichier : AIzaabcdefghijklmnopqrstuvwxyzABCDEFGHI pour Maps, glpat-abcdefghijklmnopqrst pour la CI."
    expect:
      - {category: SECRET_GOOGLE_KEY, value: "AIzaabcdefghijklmnopqrstuvwxyzABCDEFGHI"}
      - {category: SECRET_GITLAB_TOKEN, value: "glpat-abcdefghijklmnopqrst"}

  - id: sec-slack-stripe-twilio
    text: "À révoquer avant ce soir : xoxb-0123456789-a côté Slack, sk_live_abcdefghijklmnopqrstuvwx côté Stripe, SK0123456789abcdef0123456789abcdef côté Twilio."
    expect:
      - {category: SECRET_SLACK_TOKEN, value: "xoxb-0123456789-a"}
      - {category: SECRET_STRIPE_KEY, value: "sk_live_abcdefghijklmnopqrstuvwx"}
      - {category: SECRET_TWILIO_KEY, value: "SK0123456789abcdef0123456789abcdef"}

  - id: sec-sendgrid
    text: "L'envoi des factures utilise SG.abcdefghijklmnopqrstuv.abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQ depuis mars."
    expect:
      - {category: SECRET_SENDGRID_KEY, value: "SG.abcdefghijklmnopqrstuv.abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQ"}

  - id: sec-registries
    text: "Les trois registres partagent le même compte de service : npm_abcdefghijklmnopqrstuvwx, pypi-abcdefghijklmnopqrstuvwx et dckr_pat_abcdefghijklmnopqrstuvwx."
    expect:
      - {category: SECRET_NPM_TOKEN, value: "npm_abcdefghijklmnopqrstuvwx"}
      - {category: SECRET_PYPI_TOKEN, value: "pypi-abcdefghijklmnopqrstuvwx"}
      - {category: SECRET_DOCKER_TOKEN, value: "dckr_pat_abcdefghijklmnopqrstuvwx"}

  - id: sec-model-hosts
    text: "Le notebook porte hf_abcdefghijklmnopqrstuvwx en dur, et r8_abcdefghijklmnopqrstuvwx pour l'inférence."
    expect:
      - {category: SECRET_HF_TOKEN, value: "hf_abcdefghijklmnopqrstuvwx"}
      - {category: SECRET_REPLICATE_TOKEN, value: "r8_abcdefghijklmnopqrstuvwx"}

  - id: sec-jwt
    text: "La requête part avec Authorization: Bearer eyJabcdefghijkl.eyJabcdefghijklmn.abcdefghijklmnopqrst dans les logs."
    expect:
      - {category: SECRET_JWT, value: "eyJabcdefghijkl.eyJabcdefghijklmn.abcdefghijklmnopqrst"}

  - id: sec-pem-header
    text: "Le fichier joint commence par -----BEGIN OPENSSH PRIVATE KEY----- ce qui explique le refus du dépôt."
    expect:
      - {category: SECRET_PEM_KEY, value: "-----BEGIN OPENSSH PRIVATE KEY-----"}

  # The named-value shapes: the credential is the value, not the whole
  # assignment, so the span must stop at the name.
  - id: sec-aws-secret-named
    text: "Extrait du fichier d'environnement : aws_secret_access_key = abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMN"
    expect:
      - {category: SECRET_AWS_SECRET_KEY, value: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMN"}

  - id: sec-generic-named
    text: "Le conteneur démarre avec PASSWORD=hunter2-correct-horse dans sa configuration."
    expect:
      - {category: SECRET_GENERIC, value: "hunter2-correct-horse"}

  - id: sec-hex-named
    text: "La signature utilise KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef depuis la migration."
    expect:
      - {category: SECRET_HEX_KEY, value: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"}

  # === Notations the catalogue accepts within a category already covered ===
  #
  # The gate is per category, so it cannot see a *pattern* nobody exercises:
  # Slack is two patterns and OpenAI is three, and one case each left the others
  # unmeasured behind a category that looked covered.

  - id: sec-github-other-prefixes
    text: "Rotation en cours : gho_0123456789abcdefghijklmnopqrstuvwxyz pour l'app OAuth, ghs_0123456789abcdefghijklmnopqrstuvwxyz pour le runner."
    expect:
      - {category: SECRET_GITHUB_TOKEN, value: "gho_0123456789abcdefghijklmnopqrstuvwxyz"}
      - {category: SECRET_GITHUB_TOKEN, value: "ghs_0123456789abcdefghijklmnopqrstuvwxyz"}

  - id: sec-slack-app-level
    text: "Le jeton applicatif xapp-0123456789-z est distinct du jeton bot et vit dans une autre variable."
    expect:
      - {category: SECRET_SLACK_TOKEN, value: "xapp-0123456789-z"}

  - id: sec-openai-legacy
    text: "Une ancienne clé sk-abcdefghijklmnopqrstuvwxyz0123 traîne encore dans le dépôt."
    expect:
      - {category: SECRET_OPENAI_KEY, value: "sk-abcdefghijklmnopqrstuvwxyz0123"}

  - id: sec-conn-str-other-schemes
    text: "Restauration depuis mongodb+srv://svc:tr0ub4dor@cluster.example:27017/app hier soir, puis le broker a repris sur amqp://guest:gu3st@broker.internal:5672/ ce matin."
    expect:
      - {category: SECRET_CONN_STR, value: "svc:tr0ub4dor@cluster.example:27017/app"}
      - {category: SECRET_CONN_STR, value: "guest:gu3st@broker.internal:5672/"}

  - id: sec-aws-secret-other-name
    text: "Import hérité : aws_secret: bcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNO figure en clair dans le playbook."
    expect:
      - {category: SECRET_AWS_SECRET_KEY, value: "bcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNO"}

  - id: sec-generic-spaced-assignment
    text: "Dans le vault : SECRET = troisieme-valeur-longue à faire tourner ce trimestre."
    expect:
      - {category: SECRET_GENERIC, value: "troisieme-valeur-longue"}

  # The header a credential actually travels in — a log line, a curl paste, every
  # API page there is — and nothing in this catalogue read it, so the whole of it
  # went to the model in clear. The scheme is the evidence here rather than the
  # name of a field: after `Bearer` there is a credential and nothing else.
  - id: sec-auth-header-bearer
    text: "Le log de production porte Authorization: Bearer 4aMM9zedoh3OUNbSakBymo7yplBf6CGV en clair."
    expect:
      - {category: SECRET_GENERIC, value: "4aMM9zedoh3OUNbSakBymo7yplBf6CGV"}

  - id: sec-auth-header-basic
    text: "Le client s'annonce avec Authorization: Basic YWRtaW46aHVudGVyMg== depuis la migration."
    expect:
      - {category: SECRET_GENERIC, value: "YWRtaW46aHVudGVyMg=="}

  # A whole family of configuration files puts its credentials in an element
  # rather than in an assignment, and none of them was read.
  - id: sec-generic-xml-element
    text: "Le fichier Spring porte <apiSecret>ymo7yplBf6CGV4aMM9zedoh3OUNbSak</apiSecret> dans sa configuration."
    expect:
      - {category: SECRET_GENERIC, value: "ymo7yplBf6CGV4aMM9zedoh3OUNbSak"}

  # The two separators a hash literal writes, in PHP and in a pasted note.
  - id: sec-generic-arrow-separators
    text: "Le tableau PHP déclare 'token' => 'Bymo7yplBf6CGV4aMM9zedoh3OUNbSa' et la note dit api_key -> akBymo7yplBf6CGV4aMM9zedoh3OUNb pour ce client."
    expect:
      - {category: SECRET_GENERIC, value: "Bymo7yplBf6CGV4aMM9zedoh3OUNbSa"}
      - {category: SECRET_GENERIC, value: "akBymo7yplBf6CGV4aMM9zedoh3OUNb"}

  # Go's short declaration and the Makefile assignments. With `[=:]` alone the
  # colon was the separator and the value never began, so the whole line went
  # out in clear.
  - id: sec-generic-short-declaration
    text: 'Le code Go porte apiKey := "8dyfuiRyq=vVc3RRr_edRk-fK__JItpZ" et le Makefile dit TOKEN ?= oh3OUNbSakBymo7yplBf6CGV4aMM9zed puis DB_PASSWORD ::= zedoh3OUNbSakBymo7yplBf6CGV4aMM9 pour la CI.'
    expect:
      - {category: SECRET_GENERIC, value: "8dyfuiRyq=vVc3RRr_edRk-fK__JItpZ"}
      - {category: SECRET_GENERIC, value: "oh3OUNbSakBymo7yplBf6CGV4aMM9zed"}
      - {category: SECRET_GENERIC, value: "zedoh3OUNbSakBymo7yplBf6CGV4aMM9"}

  # The short form of "credential", which the repeated-letter tolerance cannot
  # reach from CREDENTIAL.
  - id: sec-generic-creds
    text: "Le fichier .env porte DB_CREDS=hunter2-correct-horse pour la base de recette."
    expect:
      - {category: SECRET_GENERIC, value: "hunter2-correct-horse"}

  # quoteChars holds `\s`, so one space behind the opening quote ended the
  # expression before it began and the same line without the spaces was masked.
  # The padding is not part of the value: the span replaced is the credential.
  - id: sec-generic-padded-quotes
    text: 'Le fichier .env porte API_KEY=" MM9zedoh3OUNbSakBymo7yplBf6CGV4 " avec des espaces autour.'
    expect:
      - {category: SECRET_GENERIC, value: "MM9zedoh3OUNbSakBymo7yplBf6CGV4"}

  # "credential" and not "key". A bare key is what half the configuration
  # languages there are call the left-hand side of a pair, so it names a
  # credential no more often than it names nothing at all.
  - id: sec-generic-credential-keyword
    text: "Le vault expose CREDENTIAL=zedoh3OUNbSakBymo7yplBf6CGV4aMM pour ce service."
    expect:
      - {category: SECRET_GENERIC, value: "zedoh3OUNbSakBymo7yplBf6CGV4aMM"}

  - id: sec-hex-colon-assignment
    text: "Signature des webhooks : SIGNING_KEY: ffeeddccbbaa99887766554433221100ffeeddccbbaa99887766554433221100"
    expect:
      - {category: SECRET_HEX_KEY, value: "ffeeddccbbaa99887766554433221100ffeeddccbbaa99887766554433221100"}

  # === Vendor prefixes, second tier ===
  #
  # One case per vendor, carrying every notation that vendor issues. Every value
  # is fabricated to match the shape and is not a revoked real key: the prefix
  # is what is under test, the body is filler.

  - id: sec-vendor-1password
    text: "Le ticket contient encore A3-UJZDE8-GXD6NCF10EP-F91DH-ODZDO-C9IS0 et ops_eyJspNxnyVmihA/2O76UMFxFkM/R5Kjp1vRt+1fjORS/6ilI8ihN5KXSc7Tvo/hBKqFYY/kv5ZJr3J1TWDtkwtDDb+xHKas1VOqg6YYZYn9ZhyiA4uoRgnatmUdjAWtGSU8po+799NksnRH9ucAUsdMlHUvTCQCyEZDz/TddJ8HyS5SUkCnD8zRA9a9SkpXz9w3QlY7Zkuvqdt7s8Stqcbnr3yBdGBLEPH1qhT61qtc4xatws8phP9nhFyJfm en clair."
    expect:
      - {category: SECRET_1PASSWORD, value: "A3-UJZDE8-GXD6NCF10EP-F91DH-ODZDO-C9IS0"}
      - {category: SECRET_1PASSWORD, value: "ops_eyJspNxnyVmihA/2O76UMFxFkM/R5Kjp1vRt+1fjORS/6ilI8ihN5KXSc7Tvo/hBKqFYY/kv5ZJr3J1TWDtkwtDDb+xHKas1VOqg6YYZYn9ZhyiA4uoRgnatmUdjAWtGSU8po+799NksnRH9ucAUsdMlHUvTCQCyEZDz/TddJ8HyS5SUkCnD8zRA9a9SkpXz9w3QlY7Zkuvqdt7s8Stqcbnr3yBdGBLEPH1qhT61qtc4xatws8phP9nhFyJfm"}

  - id: sec-vendor-intra42
    text: "L'export de configuration porte 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, à révoquer."
    expect:
      - {category: SECRET_INTRA42, value: "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"}

  - id: sec-vendor-adobe
    text: "Collé dans le fil de support : p8e-629be2u66mr26846p7q9m2i0hz2uep1e."
    expect:
      - {category: SECRET_ADOBE, value: "p8e-629be2u66mr26846p7q9m2i0hz2uep1e"}

  - id: sec-vendor-age
    text: "Le script de déploiement embarque AGE-SECRET-KEY-1DN8FHFSGAWXEL2W2ME46VK59HP4AUPC4JY8WX9S3ZT3GMSEFL593RTMY3P en dur."
    expect:
      - {category: SECRET_AGE, value: "AGE-SECRET-KEY-1DN8FHFSGAWXEL2W2ME46VK59HP4AUPC4JY8WX9S3ZT3GMSEFL593RTMY3P"}

  - id: sec-vendor-aikido
    text: "Trouvé dans un dépôt public : AIK_CI_oFzQFm2OEQ3HdAVja76R et AIK_SECRET_nIChtP8HKQDLM7ToThwNScgrLRWzBQCABugjMgeP7cGq0pbqfi14ZgTsNOVM14tu."
    expect:
      - {category: SECRET_AIKIDO, value: "AIK_CI_oFzQFm2OEQ3HdAVja76R"}
      - {category: SECRET_AIKIDO, value: "AIK_SECRET_nIChtP8HKQDLM7ToThwNScgrLRWzBQCABugjMgeP7cGq0pbqfi14ZgTsNOVM14tu"}

  - id: sec-vendor-airtable
    text: "Le ticket contient encore patOizwd1iaeOV4qB.fbc6313b8ff28a25441b305fa46c9201ac2ce6b6a331ce649e3eb7ea1cabe5d6 en clair."
    expect:
      - {category: SECRET_AIRTABLE, value: "patOizwd1iaeOV4qB.fbc6313b8ff28a25441b305fa46c9201ac2ce6b6a331ce649e3eb7ea1cabe5d6"}

  - id: sec-vendor-alibaba
    text: "L'export de configuration porte LTAI1cjDoBoirPfQAdzEv et STS.7g5iFqhEvveQzE2Q, à révoquer."
    expect:
      - {category: SECRET_ALIBABA, value: "LTAI1cjDoBoirPfQAdzEv"}
      - {category: SECRET_ALIBABA, value: "STS.7g5iFqhEvveQzE2Q"}

  - id: sec-vendor-apify
    text: "Collé dans le fil de support : apify_api_PuwNOvpdf2YEe6rSxCnopMEmJVQpvsTnkI."
    expect:
      - {category: SECRET_APIFY, value: "apify_api_PuwNOvpdf2YEe6rSxCnopMEmJVQpvsTnkI"}

  - id: sec-vendor-artifactory
    text: "Le script de déploiement embarque AKCpAeDfRrGsNrfSthSdddxH5jMTF7eBSdE0g9cRYN687NElFJvhQ8XIm0ogR4HtXOf54fZB et cmVmdKA8frcZTuJaWYUH1VAUwV1ZH87MtA5vSQXEZY3lEX7bwR2DRGD1qSo7JPRb en dur."
    expect:
      - {category: SECRET_ARTIFACTORY, value: "AKCpAeDfRrGsNrfSthSdddxH5jMTF7eBSdE0g9cRYN687NElFJvhQ8XIm0ogR4HtXOf54fZB"}
      - {category: SECRET_ARTIFACTORY, value: "cmVmdKA8frcZTuJaWYUH1VAUwV1ZH87MtA5vSQXEZY3lEX7bwR2DRGD1qSo7JPRb"}

  - id: sec-vendor-asaas
    text: "Trouvé dans un dépôt public : $aact_prod_oYv2DzaKG05Rk_GQV81r et $aact_hmlg_kmghzem9yPVUJa-c5q52."
    expect:
      - {category: SECRET_ASAAS, value: "$aact_prod_oYv2DzaKG05Rk_GQV81r"}
      - {category: SECRET_ASAAS, value: "$aact_hmlg_kmghzem9yPVUJa-c5q52"}

  - id: sec-vendor-authress
    text: "Le ticket contient encore sc_i9mpf.lv9f.acc-pxq-mb0y07.nyrvd5r+xi67-nfrpyz21tbic14/5a et ext_ez732.pgoj.acc_7g3f9caio-.cti-q7-1hget7/myqo_aa8t3rup47p et scauth_9pb0t.dbm5.acc-fqo1xo5cv0.xzmas6en5mtmo3oqsg=5=lo50d_jzd et authress_nbj0d.dlz2.acc-hfkvml73ct.yxv2kgafrfw0h9nywt1fd4mx82mux4 en clair."
    expect:
      - {category: SECRET_AUTHRESS, value: "sc_i9mpf.lv9f.acc-pxq-mb0y07.nyrvd5r+xi67-nfrpyz21tbic14/5a"}
      - {category: SECRET_AUTHRESS, value: "ext_ez732.pgoj.acc_7g3f9caio-.cti-q7-1hget7/myqo_aa8t3rup47p"}
      - {category: SECRET_AUTHRESS, value: "scauth_9pb0t.dbm5.acc-fqo1xo5cv0.xzmas6en5mtmo3oqsg=5=lo50d_jzd"}
      - {category: SECRET_AUTHRESS, value: "authress_nbj0d.dlz2.acc-hfkvml73ct.yxv2kgafrfw0h9nywt1fd4mx82mux4"}

  - id: sec-vendor-azure-app-configuration
    text: "L'export de configuration porte Endpoint=https://example-config.azconfig.io;Id=abcd;Secret=abcdefghijklmnopqrstuvwxyz0123456789, à révoquer."
    expect:
      - {category: SECRET_AZURE_APP_CONFIGURATION, value: "Endpoint=https://example-config.azconfig.io;Id=abcd;Secret=abcdefghijklmnopqrstuvwxyz0123456789"}

  - id: sec-vendor-azure-servicebus
    text: "Collé dans le fil de support : Endpoint=sb://uu3.servicebus.windows.net/;SharedAccessKeyName=P;SharedAccessKey=KZyUf0IE9pU2NJhKaM1/5WdR16ePllji."
    expect:
      - {category: SECRET_AZURE_SERVICEBUS, value: "Endpoint=sb://uu3.servicebus.windows.net/;SharedAccessKeyName=P;SharedAccessKey=KZyUf0IE9pU2NJhKaM1/5WdR16ePllji"}

  - id: sec-vendor-brave-search
    text: "Le script de déploiement embarque BSAvghZ4fXfeTkYpIygfdM7ENA8 en dur."
    expect:
      - {category: SECRET_BRAVE_SEARCH, value: "BSAvghZ4fXfeTkYpIygfdM7ENA8"}

  - id: sec-vendor-sendinblue
    text: "Trouvé dans un dépôt public : xkeysib-5C7Ef653Cc3be1c61D641ac6ed0Cd712Cc28Fdb3DAc8CCFA444168C28E093dbe-ZRsdM3IVV8iwO2y2."
    expect:
      - {category: SECRET_SENDINBLUE, value: "xkeysib-5C7Ef653Cc3be1c61D641ac6ed0Cd712Cc28Fdb3DAc8CCFA444168C28E093dbe-ZRsdM3IVV8iwO2y2"}

  - id: sec-vendor-buildkite
    text: "Le ticket contient encore bkaa_d5vFldPGYYJvW5hANsbEvrSFagEaBp0vXnJaE-9I0MyTLUyi0kn1Gnt11CuZyzaA3U2OLzu6UQB et bkua_d9jzfx6kjwsk7kegy5mtic4udyfkozm4lncz7kyw en clair."
    expect:
      - {category: SECRET_BUILDKITE, value: "bkaa_d5vFldPGYYJvW5hANsbEvrSFagEaBp0vXnJaE-9I0MyTLUyi0kn1Gnt11CuZyzaA3U2OLzu6UQB"}
      - {category: SECRET_BUILDKITE, value: "bkua_d9jzfx6kjwsk7kegy5mtic4udyfkozm4lncz7kyw"}

  - id: sec-vendor-canva
    text: "L'export de configuration porte cnvcaptFyfePpX6N1NF2XV54wca_7E56w8ZniqT3Ul4ffqkOkgWrdioy, à révoquer."
    expect:
      - {category: SECRET_CANVA, value: "cnvcaptFyfePpX6N1NF2XV54wca_7E56w8ZniqT3Ul4ffqkOkgWrdioy"}

  - id: sec-vendor-cerebras
    text: "Collé dans le fil de support : csk-i5skoewqkur3jq64nq6puxcmlzkruykqh7dx297gq8zxqyxj."
    expect:
      - {category: SECRET_CEREBRAS, value: "csk-i5skoewqkur3jq64nq6puxcmlzkruykqh7dx297gq8zxqyxj"}

  - id: sec-vendor-circleci
    text: "Le script de déploiement embarque CCIPAT_xvWfColNV9ds0HqtO93L7Q_uacojs106xdi5ocbdawtg7w8o0tinx4kiapj2gej en dur."
    expect:
      - {category: SECRET_CIRCLECI, value: "CCIPAT_xvWfColNV9ds0HqtO93L7Q_uacojs106xdi5ocbdawtg7w8o0tinx4kiapj2gej"}

  - id: sec-vendor-clickhouse
    text: "Trouvé dans un dépôt public : 4b1d3qyRZzQ9ADp0j5Wmplcm7hufPK5ACDiBZLPKD6."
    expect:
      - {category: SECRET_CLICKHOUSE, value: "4b1d3qyRZzQ9ADp0j5Wmplcm7hufPK5ACDiBZLPKD6"}

  # Two keys one separator apart. The expression consumes its trailing boundary,
  # so scanning resumed after the comma and the second key had no boundary left
  # in front of it — every second key of a rotated-keys list went out in clear.
  - id: sec-vendor-clickhouse-adjacent
    text: "Les deux clés : 4b1d3qyRZzQ9ADp0j5Wmplcm7hufPK5ACDiBZLPKD6,4b1dXqyRZzQ9ADp0j5Wmplcm7hufPK5ACDiBZLPKD7 sont à révoquer."
    expect:
      - {category: SECRET_CLICKHOUSE, value: "4b1d3qyRZzQ9ADp0j5Wmplcm7hufPK5ACDiBZLPKD6"}
      - {category: SECRET_CLICKHOUSE, value: "4b1dXqyRZzQ9ADp0j5Wmplcm7hufPK5ACDiBZLPKD7"}

  - id: sec-vendor-clojars
    text: "Le ticket contient encore CLOJARS_ga9mj0m760l6tetd48ay13f2logqochvqdr917qsnf6akqpmkumyvpy8447a en clair."
    expect:
