    expect: []

  # --- session tokens -------------------------------------------------------
  #
  # A session cookie is a live credential and read like any other named secret.
  # It went unmasked because "session" was missing from the keyword list, and the
  # hex pattern beside it needs sixty-four characters — a floor set to keep a
  # truncated commit SHA out, which is exactly the length a session token is not.

  - id: secret-session-cookie
    text: "Set-Cookie: session=abcdef1234567890abcdef1234567890; HttpOnly"
    expect:
      - {category: SECRET_GENERIC, value: "abcdef1234567890abcdef1234567890"}

  - id: secret-session-assignment
    text: "session=8f14e45fceea167a5a36dedd4bea2543"
    expect:
      - {category: SECRET_GENERIC, value: "8f14e45fceea167a5a36dedd4bea2543"}

  # The same word in source code, which is where a keyword-driven pattern always
  # over-reaches. Each of these is held by a different rule in GenericSecretCheck:
  # the opening bracket, the identifier shape with no digit in it.
  - id: secret-prec-session-constructor
    text: "session = requests.Session()"
    expect: []

  - id: secret-prec-session-type-annotation
    text: "session: any = get_session(request)"
    expect: []

  - id: secret-prec-session-hook
    text: "const session = useSession()"
    expect: []

  - id: secret-prec-session-literal-word
    text: 'session: "anonymous"'
    expect: []

  # A type annotation whose type name carries a digit, which is how a numbered
  # standard is written: Http2, Base64, Int32, SHA256, X509, UTF8.
  #
  # These held "session" out of the shared keyword list. The rule that reads a
  # named secret treats the name as the evidence, and GenericSecretCheck then
  # separates a credential from source code by asking whether an identifier
  # carries a digit — because `Sup3rS3cr3tValue123` does. A type name built on a
  # numbered standard defeats that completely, and a session token is held apart
  # from one by its length instead.
  - id: secret-prec-session-type-annotation-http2
    text: "readonly session: Http2Session;"
    expect: []

  - id: secret-prec-session-type-annotation-base64
    text: "const session: Base64String = decode(raw)"
    expect: []

  # === Precision, second tier: a vendor prefix one character short of its floor ===
  #
  # Recall alone cannot fail a prefix pattern — one widened to `figd_.*` scores
  # 100% recall on every case above. What these hold is the length, which is the
  # only other thing a prefix pattern asserts: each value is a real prefix with a
  # body one character under the floor, and each must come out untouched.
  #
  # Five vendors have no row here and it is deliberate. A shortened Cerebras key
  # is still claimed by openAILegacyRe from offset 1 (the TODO in
  # patterns_secret.go names it), and PlanetScale, Proof, RunPod and Salesforce
  # have an open-ended body a shorter run still satisfies, so there is no
