  # === Qualified by hand: docs/secret-shapes-to-label.md ===
  #
  # Twelve shapes that were forwarded in clear, each refused by a rule that read
  # punctuation, length or the absence of a digit as evidence of code. They were
  # put to a person one at a time and answered "mask it", so they are here rather
  # than in a comment: what the engine gave up is now what the gate holds it to.

  - id: sec-qualified-punctuation-in-a-quoted-value
    text: "Le fichier porte password=\"Wh4t?Really\" et password=\"a;b;c1234x\", plus password=\"red,blue1x\" plus bas."
    expect:
      - {category: SECRET_GENERIC, value: "Wh4t?Really"}
      - {category: SECRET_GENERIC, value: "a;b;c1234x"}
      - {category: SECRET_GENERIC, value: "red,blue1x"}

  # A pair that opens and closes inside the value is punctuation somebody typed.
  # Only an *unclosed* opener says the span was cut out of an expression.
  - id: sec-qualified-balanced-brackets
    text: "Deux mots de passe entre guillemets : password=\"pa(ren)th1s\" et password=\"[brackets]1\"."
    expect:
      - {category: SECRET_GENERIC, value: "pa(ren)th1s"}
      - {category: SECRET_GENERIC, value: "[brackets]1"}

  - id: sec-qualified-bare-question-mark
    text: "Sans guillemets non plus : PASSWORD=Wh4t?Really dans le script."
    expect:
      - {category: SECRET_GENERIC, value: "Wh4t?Really"}

  # Two tokens behind a plural name are still two tokens.
  - id: sec-qualified-comma-separated-list
    text: "La variable API_TOKENS=abc12345,def67890 est lue au démarrage."
    expect:
      - {category: SECRET_GENERIC, value: "abc12345,def67890"}

  # Lowercase words are how a passphrase is written. The digit rule read them as
  # code, and this is the gap the catalogue was measured against betterleaks on.
  - id: sec-qualified-letters-only
    text: "Le .env contient PASSWORD=correcthorse, et l'autre poste PASSWORD=changeme."
    expect:
      - {category: SECRET_GENERIC, value: "correcthorse"}
      - {category: SECRET_GENERIC, value: "changeme"}

  - id: sec-qualified-letters-only-quoted
    text: "Dans le YAML : password=\"correcthorse\" depuis l'installation."
    expect:
      - {category: SECRET_GENERIC, value: "correcthorse"}

  # A capital is a camelCase join only after a lowercase letter. Read as one
  # wherever it fell, an ALL-CAPS password was refused as a code identifier while
  # the same word with its first letter alone capitalised was masked.
  - id: sec-qualified-all-caps
    text: "Le fichier contient PASSWORD=HUNTER et DB_PASSWORD=MYSECRET pour la recette."
    expect:
      - {category: SECRET_GENERIC, value: "HUNTER"}
      - {category: SECRET_GENERIC, value: "MYSECRET"}

  # A quoted value ends where its quote does, so an unclosed bracket inside it is
  # the password's own. Only a bare span was cut out of an expression.
  - id: sec-qualified-quoted-unclosed-bracket
    text: "Dans le YAML : password=\"Ab(12cd\" et token=\"k3y{5xz\" pour les tests."
    expect:
      - {category: SECRET_GENERIC, value: "Ab(12cd"}
      - {category: SECRET_GENERIC, value: "k3y{5xz"}

  # Six characters is a bad password, not an absent one.
  - id: sec-qualified-six-characters
    text: "Le compte de service utilise PASSWORD=mcjrx4 encore aujourd'hui."
    expect:
      - {category: SECRET_GENERIC, value: "mcjrx4"}

  # A chain that names nothing and carries no capital is a password with a dot in
  # it. `secret = config.password` is the other half and must stay in clear: it
  # names where the credential was read from, so it is code reading one.
  - id: sec-qualified-dotted-value
    text: "La ligne secret=abcdef.ghijkl est passée en revue."
    expect:
      - {category: SECRET_GENERIC, value: "abcdef.ghijkl"}

  - id: sec-qualified-dotted-value-that-names-itself
    text: "Le module fait secret = config.password au chargement."
    expect: []

  # Optional chaining is code, and it is the one row in section A answered "no".
  - id: sec-qualified-optional-chaining
    text: "Le handler lit token = user?.token2 avant de répondre."
    expect: []

  # A word the language reserved is not a password. Both of these were claimed in
  # this repository's own source once a lowercase word counted as a credential.
  - id: sec-qualified-reserved-words
    text: "L'interface déclare secret_level: string et l'en-tête porte 'X-Session-Id': 'default'."
    expect: []

  # === Precision: none of this may be flagged ===

  # A keyword-prefixed name with a number behind it is a tunable, not a secret.
  # `max_tokens` is the most common numeric field in this agent's own domain, and a
  # pasted model configuration must not reach the model with its numbers replaced.
  - id: sec-prec-numeric-tunable
    text: "La configuration fixe max_tokens=200000, TOKEN_TTL_SECONDS=8640000 et PASSWORD_MIN_LENGTH=12 pour ce profil."
    expect: []

  - id: sec-prec-commit-sha
    text: "Le correctif est dans le commit a94a8fe5ccb19ba61c4c0873d391e987982fbbd3 de vendredi."
    expect: []

  # 40 hex under a name the hex pattern watches: the length floor of 64 is what
  # separates an encryption key from a commit SHA someone assigned to a field.
  - id: sec-prec-hex-too-short
    text: "Le champ KEY=a94a8fe5ccb19ba61c4c0873d391e987982fbbd3 n'est qu'un SHA tronqué."
    expect: []

  - id: sec-prec-uuid
    text: "Identifiant de trace 3f2504e0-4f89-11d3-9a0c-0305e82c3301 dans les logs."
    expect: []

  # The regression the connection-string pattern names in its own comment: a
  # port followed by a later "@" once read as user:password and came out
  # irreversibly destroyed. It stays in the corpus so a widened password class
  # brings it straight back.
  - id: sec-prec-vite-url
    text: "Le dev tourne sur http://localhost:5173/@vite/client sans souci."
    expect: []

  - id: sec-prec-url-without-credentials
    text: "Doc publique : https://api.example.com/v1/status?page=2 renvoie du JSON."
    expect: []

  # PEM matches on PRIVATE KEY, not on the delimiter shape: a certificate and a
  # public key are meant to be shared, and masking them breaks the paste for
  # nothing.
  - id: sec-prec-public-pem-blocks
    text: "Le fichier joint commence par -----BEGIN CERTIFICATE----- et la clé publique -----BEGIN PUBLIC KEY----- peut être partagée."
    expect: []

  - id: sec-prec-jwt-lookalike
    text: "Le blob base64 abcdefghijklmnop.qrstuvwxyz012345.6789abcdefghij est un checksum, pas un jeton."
    expect: []

  - id: sec-prec-version-string
    text: "Version déployée : sk-1.2.3 sur le cluster de test."
    expect: []

  - id: sec-prec-lowercase-aws-prefix
    text: "Le préfixe akiaabcdefghijklmnop en minuscules n'est pas un identifiant AWS."
    expect: []

  - id: sec-prec-generic-value-too-short
    text: "Réglage TOKEN: court dans le fichier de conf."
    expect: []

  # Source code, not credentials. genericSecretRe reads "NAME=value" and treats the
  # name as the evidence, which holds in a .env line and collapses in code, where
  # `password:` is a field name and the right side is an expression. Every case here
  # was observed on one real run against a repository, and each went to the model as
  # [SECRET_n] — a review of code whose identifiers had been replaced.
  - id: sec-generic-code-property-chain
    text: "Le handler lit const token = req.cookies.token avant de vérifier."
    expect: []

  - id: sec-generic-code-bare-identifier
    text: "On compare ensuite password: newPassword dans le contrôleur."
    expect: []

  - id: sec-generic-code-call
    text: "La ligne token: utils.jwtFrom(req) extrait le jeton porteur."
    expect: []

  - id: sec-generic-code-env-lookup
    text: "Le client lit apiKey: process.env.LLM_API_KEY au démarrage."
    expect: []

  - id: sec-generic-code-type-annotation
    text: "Le modèle déclare totpSecret: CreationOptional<string> en base."
    expect: []

  # A member access whose digit comes from a service name. Observed on a real run:
  # the value went to the model as [SECRET_1], so the review was of Go code with a
  # field access replaced by a token. Identifier-shaped and carrying a digit, it
  # satisfied both halves of the digit rule that keeps Sup3rS3cr3tValue123 — and
  # every cloud SDK spells its services with one: s3, ec2, oauth2, sha256, v1.
  - id: sec-generic-code-service-digit-chain
    text: "Le client S3 lit secret: c.S3.SecretAccessKey au démarrage."
    expect: []

  - id: sec-generic-code-service-digit-chain-oauth
    text: "On passe token: client.oauth2.Token au transport HTTP."
    expect: []

  # And the direction that rule over-reached in. A read token was forwarded in
  # clear: one interior dot in a hundred and eighty-two characters of base64url
  # bought it the promise written for c.S3.SecretAccessKey. The value is synthetic
  # — same length and same two failing segments — because the observed one is live.
  - id: sec-generic-token-carrying-a-dot
    text: "Le shell exporte WARP_READ_TOKEN=yrqUJHsihujAc7e1yqb3RRNqMaZjMPsqYjB0dsj68QnzpRAUOg6W7jyMNpgoCMpq78LkAmawnBq7a7PhltL1KimflP9a9V6WIfo74hFBWThWcZkUov5963yQhnD6LtEe4mYpulmDwlJLSdcWsbSh8N1JnhGmcVhq8.37Zimmlrk4sWXTTU9XlF pour l'agent."
    expect:
      - {category: SECRET_GENERIC, value: "yrqUJHsihujAc7e1yqb3RRNqMaZjMPsqYjB0dsj68QnzpRAUOg6W7jyMNpgoCMpq78LkAmawnBq7a7PhltL1KimflP9a9V6WIfo74hFBWThWcZkUov5963yQhnD6LtEe4mYpulmDwlJLSdcWsbSh8N1JnhGmcVhq8.37Zimmlrk4sWXTTU9XlF"}

  # The other half: the longest chains code really writes must still come out
  # untouched, or the segment cap that catches the token above claims member
  # accesses again.
  - id: sec-generic-code-long-property-chain
    text: "Le service lit token: security.authenticatedUsers.tokenOfTheCurrentSession ici."
    expect: []

  # A route name behind `password:`. It has the shape of the credential in
  # sec-generic-spaced-assignment — lowercase words joined by hyphens — so no rule
  # about shape could separate them. What does is that this one names the thing it
  # unlocks, which a passphrase never does.
  - id: sec-generic-code-route-slug
    text: "Le formulaire poste vers password: reset-password côté client."
    expect: []

  # The same slug with the joiner a README writes. The rule listed api_key and
  # not api-key, so this was masked while your_api_key_here was not.
  - id: sec-generic-code-placeholder-slug
    text: "Le README dit API_KEY=your-api-key-here à remplacer avant de lancer."
    expect: []

  # A short declaration whose right-hand side is code, now that `:=` is a
  # separator. The call is what GenericSecretCheck refuses; the identifier
  # carrying no digit is the other half. With a digit in it (`Prod1MyService`,
  # the false positive gitleaks records against its own generic rule) it would
  # be masked — knowingly, because Sup3rS3cr3tValue123 has the same shape.
  - id: sec-generic-code-short-declaration
    text: "Dans le handler, token := utils.jwtFrom(req) puis tokenName := 'ProdMyService' sont lus."
    expect: []

  # The keyword no longer has to be the last segment of the name. The separator
  # used to have to follow it immediately, so a prefix was free and a suffix was
  # fatal — and STRIPE_SECRET_KEY is how a Stripe or an AWS key is actually named,
  # missed by nothing but where the word fell in the name.
  - id: sec-generic-keyword-not-the-last-segment
    text: "Le fichier .env porte STRIPE_SECRET_KEY=f6CGV4aMM9zedoh3OUNbSakBymo7yplB en production."
    expect:
      - {category: SECRET_GENERIC, value: "f6CGV4aMM9zedoh3OUNbSakBymo7yplB"}

  # A repeated letter: a typo, and the shape somebody reaches for to slip a value
  # past a scanner. Insertions only — allowing a letter to be *missing* would put
  # TKN and SCRT in the keyword list, and those are initialisms.
  - id: sec-generic-keyword-misspelled
    text: "Le script python déclare SUPER_SEECRET_VALUE = 'c3VwZXIgbG9uZyBzdHJpbmcgc2hvdWxkIGNhdXNl' au début."
    expect:
      - {category: SECRET_GENERIC, value: "c3VwZXIgbG9uZyBzdHJpbmcgc2hvdWxkIGNhdXNl"}

  # And the boundary that keeps that tail off ordinary words. Without it the name
  # runs straight on through a word that merely contains the keyword, and a
  # credential wins every overlap — so the value behind it is claimed ahead of
  # whatever category really owns it.
  - id: sec-generic-code-word-containing-a-keyword
    text: "Le formulaire lit secretary_id = adresseDuSecretariat dans la session."
    expect: []

  # The same name in the case a .env file writes it, which is the half that guard
  # used to read nothing at all: every letter of a SCREAMING_SNAKE name is a
  # capital, so a tail opening on "a separator or a capital" opened on the A of
  # SECRETARY and the word matched. The address is what it cost — a credential wins
  # every overlap, so it was replaced by [SECRET_n] instead of a stand-in address.
  - id: sec-generic-code-word-containing-a-keyword-shouted
    text: "Le fichier .env porte SECRETARIAT_EMAIL=bureau@example.fr pour les relances."
    expect:
      - {category: EMAIL, value: "bureau@example.fr"}

  # A password whose segments are ordinary words, one of which happens to end on
  # "key". credentialNameTailRe read that as a field holding a credential and
  # GenericSecretCheck refused the value, so a real password went to the model in
  # clear — the one direction that rule must never move in.
  - id: sec-generic-password-ending-on-an-english-word
    text: "Le mot de passe du bastion est password: monkey.donkey depuis mars."
    expect:
      - {category: SECRET_GENERIC, value: "monkey.donkey"}

  # Four hex characters are a prefix that occurs inside any long hash, so the
  # length is the whole of the evidence and both ends have to be bounded. Forty-two
  # characters were cut out of the middle of a lockfile integrity field and masked
  # as a ClickHouse key, leaving the rest of the hash in clear.
  - id: sec-prec-clickhouse-prefix-inside-a-hash
    text: "Le lock porte sha512-4b1d0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcd en intégrité."
    expect: []

  # A NuGet feed password with the attributes the other way round. XML attribute
  # order is not significant and the tooling writes both, so the rule that read
  # `key` first leaked every file a person had hand-edited.
  - id: sec-generic-nuget-reversed-attributes
    text: "Le NuGet.config déclare <add value=\"Hunt3rHorseBattery\" key=\"Password\" /> pour le flux privé."
    expect:
      - {category: SECRET_GENERIC, value: "Hunt3rHorseBattery"}

  # A dereference. `want.SecretLevel = *secretLevel` is a line in this agent's own
  # mask command, and it was claimed the moment the tail above existed: a star is
  # not an identifier character, so the digit rule never looked at the name behind
  # it.
  - id: sec-generic-code-dereference
    text: "La commande écrit want.SecretLevel = *secretLevel avant l'envoi."
    expect: []

  # The prose the header pattern must not claim. "Bearer authentication" has the
  # shape of a header and is a sentence about one. What refuses it is
  # AuthHeaderCheck, on the header patterns alone: a lowercase word carrying
  # `auth` behind a scheme name is prose about the mechanism.
  - id: sec-prec-auth-header-in-prose
    text: "La page décrit Authorization: Bearer authentication comme le schéma attendu."
    expect: []

  # The same refusal used to live in slugNamingItselfRe, catalogue-wide, and with
  # no boundary a bare `auth` there refused every passphrase containing the
  # letters. This is `troisieme-valeur-longue` with a different word in it.
  - id: sec-generic-passphrase-carrying-auth
    text: "Le fichier porte PASSWORD=author-of-words pour le compte de service."
    expect:
      - {category: SECRET_GENERIC, value: "author-of-words"}

  # A variable reference behind a quoted name is where the password will be read
  # from, not one. The bare `${DB_PASSWORD` is refused by the bracket rule because
  # the expression consumed its closer; quoted, the pair is balanced and only
  # interpolationRe says no — without it a pasted docker-compose.yml came back with
  # its references replaced by [SECRET_n].
  - id: sec-prec-quoted-interpolation
    text: "Le compose déclare POSTGRES_PASSWORD: \"${DB_PASSWORD}\" et l'appsettings porte \"Password\": \"{{ .Values.db.password }}\"."
    expect: []

  # A comparison has the name, the separator and a value of the right size. The
  # closing tag is the whole guard on the element pattern, and this says so.
  - id: sec-prec-comparison-is-not-an-element
    text: "Le test vérifie que secret > threshold avant de continuer le scénario."
    expect: []

  # A member access behind the arrow. `->` is a separator in a config file and a
  # dereference in half the languages there are; what separates the two is the
  # value, and GenericSecretCheck is what reads it — an identifier carrying no
  # digit is a field name.
  - id: sec-prec-generic-code-member-access
    text: "Le contrôleur appelle $password->hashedValue avant de comparer la saisie."
    expect: []

  # The refutation of the wider reading of the same idea. Sub-sequence matching —
  # the keyword's letters in order with anything at all between them — claims a
  # random base64 blob 7% of the time at sixty characters and 94% at a hundred and
  # eighty-two, so every integrity field in a lockfile becomes a *name* and it is
  # whatever follows it that gets masked. This blob carries s-e-c-r-e-t in order.
  - id: sec-generic-blob-is-not-a-name
    text: 'Le lockfile porte "vo7J4YHb6t9sBFLyY03WYhXET37qA4zOYUjBWFCRHO7pS1B9khERtY0f5JXPQ": "1.2.3" en tête.'
    expect: []

  # Groq and xAI: the two providers this agent proxies whose key carries a prefix
  # somebody can verify. The other three it proxies — Mistral, Together, DeepInfra —
  # have no pattern of their own on purpose; the case below says what happens instead.
  - id: sec-groq-and-xai-keys
    text: "Le service utilise gsk_abcdefghijklmnopqrstuvwxyz012345 et xai-abcdefghijklmnopqrstuvwxyz012345 en production."
    expect:
      - {category: SECRET_GROQ_KEY, value: "gsk_abcdefghijklmnopqrstuvwxyz012345"}
      - {category: SECRET_XAI_KEY, value: "xai-abcdefghijklmnopqrstuvwxyz012345"}

  # An unprefixed key is reached by its name, not by its shape. A Mistral key is
  # thirty-two bare alphanumerics, which is also every MD5 digest there is.
  - id: sec-unprefixed-key-caught-by-its-name
    text: "Le vault porte MISTRAL_API_KEY=7fK2mNp9QrS4tUv6WxY8zA1bC3dE5gH0 pour ce service."
    expect:
      - {category: SECRET_GENERIC, value: "7fK2mNp9QrS4tUv6WxY8zA1bC3dE5gH0"}

  # And the reason there is no bare Mistral pattern: this must come out untouched.
  - id: sec-md5-digest-is-not-a-key
    text: "Le hash MD5 du fichier est 5d41402abc4b2a76b9719d911017c592 selon le manifeste."
    expect: []

  # === Notations read off gitleaks' own rule tests ===
  #
  # gitleaks carries a `tps`/`fps` pair beside every rule
  # (cmd/generate/config/rules/*.go), which is a catalogue of what each vendor
  # shape really looks like — measured against live traffic rather than reasoned
  # from the vendor's documentation page. Replayed against this catalogue it
  # named six shapes that reached no pattern at all and one that corrupted
  # ordinary text. Each is a case below.

  # A service-account key and an admin key are neither "sk-proj-" nor the legacy
  # bare shape, and the legacy pattern admits no dash, so it stopped after seven
  # characters and both left in clear.
  - id: sec-openai-service-and-admin
    text: "Deux clés hors projet traînent : sk-svcacct-abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGH pour le batch, sk-admin-abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGH pour la facturation."
    expect:
      - {category: SECRET_OPENAI_KEY, value: "sk-svcacct-abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGH"}
      - {category: SECRET_OPENAI_KEY, value: "sk-admin-abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGH"}

  # "github_pat_" shares no prefix with "ghp_", so the fine-grained token — the
  # one GitHub now issues by default — was the common case, missed.
  - id: sec-github-fine-grained
    text: "Le workflow porte github_pat_11ABCDEFG0abcdefghijkl_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789AB en variable."
    expect:
      - {category: SECRET_GITHUB_TOKEN, value: "github_pat_11ABCDEFG0abcdefghijkl_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789AB"}

  # The temporary key is the form a pasted terminal session actually holds: an
  # operator shows what `aws sts assume-role` just printed far more often than a
  # long-lived key.
  - id: sec-aws-temporary-and-bearer-keys
    text: "La sortie collée contient ASIAY34FZKBOKMUTVV7A pour la session, ABIAY34FZKBOKMUTVV7A pour le porteur et ACCAY34FZKBOKMUTVV7A pour le contexte."
    expect:
      - {category: SECRET_AWS_ACCESS_KEY, value: "ASIAY34FZKBOKMUTVV7A"}
      - {category: SECRET_AWS_ACCESS_KEY, value: "ABIAY34FZKBOKMUTVV7A"}
      - {category: SECRET_AWS_ACCESS_KEY, value: "ACCAY34FZKBOKMUTVV7A"}

  - id: sec-stripe-prod-and-restricted
    text: "Le compte porte sk_prod_abcdefghijklmnopqrstuvwx en production et rk_live_abcdefghijklmnopqrstuvwx pour le webhook."
    expect:
      - {category: SECRET_STRIPE_KEY, value: "sk_prod_abcdefghijklmnopqrstuvwx"}
      - {category: SECRET_STRIPE_KEY, value: "rk_live_abcdefghijklmnopqrstuvwx"}

  # Uppercase hex was not merely missed: with a locale loaded, "SK" opens a
  # Slovak IBAN and the key came out masked as somebody's bank account.
  - id: sec-twilio-uppercase-hex
    text: "La clé SKFEDCBA9876543210FEDCBA9876543210 est écrite en majuscules dans le playbook."
    expect:
      - {category: SECRET_TWILIO_KEY, value: "SKFEDCBA9876543210FEDCBA9876543210"}

  - id: sec-pem-pgp-block
    text: "La pièce jointe commence par -----BEGIN PGP PRIVATE KEY BLOCK----- ce qui explique le refus."
    expect:
      - {category: SECRET_PEM_KEY, value: "-----BEGIN PGP PRIVATE KEY BLOCK-----"}

  # The Stripe pattern had no left boundary and matched *inside* a word: this
  # line was reported as the key "sk_test_abcdefghijklmnopqrstuvwxyz0123", two
  # characters into an identifier. A span that starts mid-word is the worst kind
  # — the reader gets back a value they cannot line up with anything they wrote.
  # gitleaks carries the same line as a false positive of its own — behind a
  # variable named nonMatchingToken, which here would hand the whole quoted value
  # to SECRET_GENERIC by the digit rule the moment `:=` became a separator. The
  # name is changed so the case keeps measuring the Stripe boundary alone.
  - id: sec-prec-stripe-inside-identifier
    text: "Le test déclare nonMatchingValue := \"task_test_abcdefghijklmnopqrstuvwxyz0123\" en fixture."
    expect: []

  # The price of `:=` as a separator, recorded rather than hidden. A Go test
  # declares its fixtures this way, and `wantToken := "expected-value"` is now a
  # named secret: a Go test file reviewed through this agent comes back with its
  # fixture literals replaced by [SECRET_n]. It cannot be guarded on the name —
  # `apiKey := "8dyfuiRyq=…"` is the case `:=` was added for, and both are
  # camelCase Go identifiers holding a quoted string.
  - id: sec-prec-go-short-declaration
    text: "Le test déclare wantToken := \"expected-value\" puis compare la sortie."
    expect: []
    gate: false
    note: |
      A quoted string behind a `:=` is a Go fixture as often as a Go credential,
      and nothing about the name or the value separates the two. Over-masking a
      fixture in a review is the recoverable half; a key declared the same way in
      clear is not. Closable only by a rule that reads the file — a `_test.go`
      path, a `func Test` above — which the detector is never handed.

  - id: sec-prec-word-ending-in-sk
    text: "Le champ disk_live_abcdefghijklmnopqrstuvwx désigne le volume monté."
    expect: []

  # A known gap, recorded rather than closed. An Objective-C selector beginning
  # "hf_" has the shape of a Hugging Face token, and the harm is the one
  # genericSecretRe already caused once: a code review reaching the model with
  # its identifiers replaced by [SECRET_n].
  #
  # gitleaks closes it by pinning the token to exactly thirty-four letters. That
  # narrowing is not taken here: a credential pattern cut to one observed length
  # stops matching the day the vendor lengthens it, silently, which is the one
  # failure mode a credential pattern must not have. Left visible until a rule
  # that reads shape rather than length exists.
  - id: sec-prec-hf-prefixed-identifier
    text: "Le header déclare hf_requiredCharacteristicTypesForDisplayMetadata pour l'affichage."
    expect: []
    gate: false
    note: |
      hf_ followed by twenty-plus alphanumerics is satisfied by any identifier
      carrying that prefix, and nothing in the shape separates a selector from a
      token. Closing it means either an exact length — which trades a false
      positive for a silent miss — or a rule that rejects camelCase runs, which
      does not exist yet.

  # === What trufflehog and detect-secrets add on top ===
  #
  # trufflehog carries one directory per provider under pkg/detectors, each with
  # its own tests; detect-secrets carries a plugin and a test file per shape.
  # Read against this catalogue they named one leak, two misses and one name list.

  # The leak, and the worst in this catalogue: the header pattern masked the
  # delimiter and forwarded every line of key material after it. Both other
  # projects match BEGIN through END, and this is why.
  - id: sec-pem-whole-block
    text: |-
      La clé de déploiement est en pièce jointe :
      -----BEGIN RSA PRIVATE KEY-----
      MIIEpQIBAAKCAQEAn6/O8li+SX4m98LLYt/PKSzEmQ++ZBD7Loh9P13f4yQ92EF3
      yxR5MsXFu9PRsrYQA7/4UTPHiC4y2sAVCBg4C2yyBpUEtMQjyCESi6Y=
      -----END RSA PRIVATE KEY-----
      et il faut la révoquer.
    expect:
      - category: SECRET_PEM_KEY
        value: |-
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpQIBAAKCAQEAn6/O8li+SX4m98LLYt/PKSzEmQ++ZBD7Loh9P13f4yQ92EF3
          yxR5MsXFu9PRsrYQA7/4UTPHiC4y2sAVCBg4C2yyBpUEtMQjyCESi6Y=
          -----END RSA PRIVATE KEY-----

  # A webhook URL carries no "user:password@", so the connection-string pattern
  # never saw it — and whoever holds it can post as the app.
  - id: sec-slack-webhook-url
    text: "Les alertes partent sur https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX depuis le cron."
    expect:
      - {category: SECRET_SLACK_TOKEN, value: "https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX"}

  # Padding was not a partial match but no match at all: "=" sits outside the
  # segment class, so the separator that had to follow was an "=" and the whole
  # expression failed. The token left in clear.
  - id: sec-jwt-padded
    text: "L'en-tête porte eyJabcdefghijkl==.eyJabcdefghijklmn==.abcdefghijklmnopqrst dans la trace."
    expect:
      - {category: SECRET_JWT, value: "eyJabcdefghijkl==.eyJabcdefghijklmn==.abcdefghijklmnopqrst"}

  # A claim set indented before encoding gives "ewo" where a compact one gives
  # "eyJ" — the same token, pretty-printed.
  - id: sec-jwt-indented-before-encoding
    text: "Le client envoie ewogICJhbGciOiAiSFMyNTYiCn0.ewogICJzdWIiOiAiMTIzNCIKfQ.abcdefghijklmnopqrst en Authorization."
    expect:
      - {category: SECRET_JWT, value: "ewogICJhbGciOiAiSFMyNTYiCn0.ewogICJzdWIiOiAiMTIzNCIKfQ.abcdefghijklmnopqrst"}

  # The names detect-secrets watches and this catalogue did not.
  - id: sec-generic-names-from-detect-secrets
    text: "Le vault porte AUTH_KEY=abc123def456ghi789jkl et DB_PASS=Tr0ub4dor-longue-valeur pour ce service."
    expect:
      - {category: SECRET_GENERIC, value: "abc123def456ghi789jkl"}
      - {category: SECRET_GENERIC, value: "Tr0ub4dor-longue-valeur"}

  # And the name from that list this catalogue deliberately does not take.
  # detect-secrets reads files, where "pwd" is a password field; this agent reads
  # prompts, where PWD is the working directory and appears in every pasted
  # environment dump. Adding it would mask a path on every `env` somebody shares.
  - id: sec-prec-pwd-is-a-working-directory
    text: "Le dump contient PWD=/home/utilisateur/projets comme prévu."
    expect: []

  - id: sec-prec-slack-host-without-a-webhook
