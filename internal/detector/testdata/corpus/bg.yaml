# Bulgaria suite. For now the licence plate alone, read on its own.
#
# No plate here carries a check character; the shape, the country's letters and
# the zero number no series issues are what the pattern has.
locale: bg
min_precision: 100
min_recall: 100

cases:
  - id: bg-plate-1
    text: "номер CA 1234 AB — noted."
    expect:
      - {category: LICENSE_PLATE, value: "CA 1234 AB"}

  - id: bg-plate-2
    text: "номер PB5678HK — noted."
    expect:
      - {category: LICENSE_PLATE, value: "PB5678HK"}
