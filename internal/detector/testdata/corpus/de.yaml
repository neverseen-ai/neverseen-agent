# Germany suite. For now the licence plate alone, read only behind a word naming a
# vehicle, so the same plate with no word in front must come out untouched.
#
# No plate here carries a check character; the shape, the country's letters and
# the zero number no series issues are what the pattern has.
locale: de
min_precision: 100
min_recall: 100

cases:
  - id: de-plate-1
    text: "Kennzeichen M-AB 1234 — noted."
    expect:
      - {category: LICENSE_PLATE, value: "M-AB 1234"}

  - id: de-plate-2
    text: "Kennzeichen HH XY 99E — noted."
    expect:
      - {category: LICENSE_PLATE, value: "HH XY 99E"}

  - id: de-plate-3
    text: "Kennzeichen MAB1234 — noted."
    expect:
      - {category: LICENSE_PLATE, value: "MAB1234"}

  - id: de-prec-no-word
    text: "Reference M-AB 1234 — noted."
    expect: []

  - id: de-prec-1
    text: "Geprüft nach DIN EN 1090 und ISO 9001."
    expect: []

  - id: de-prec-2
    text: "Die Norm EN 1090 gilt."
    expect: []
