# Finland suite. For now the licence plate alone, read only behind a word naming a
# vehicle, so the same plate with no word in front must come out untouched.
#
# No plate here carries a check character; the shape, the country's letters and
# the zero number no series issues are what the pattern has.
locale: fi
min_precision: 100
min_recall: 100

cases:
  - id: fi-plate-1
    text: "rekisteri ABC-123 — noted."
    expect:
      - {category: LICENSE_PLATE, value: "ABC-123"}

  - id: fi-plate-2
    text: "rekisteri XY-45 — noted."
    expect:
      - {category: LICENSE_PLATE, value: "XY-45"}

  - id: fi-prec-no-word
    text: "Reference ABC-123 — noted."
    expect: []

  - id: fi-prec-1
    text: "Katso ISO-639 ja RFC-822."
    expect: []
