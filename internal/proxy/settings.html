<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Neverseen</title>
<script>
  // Applied before the first paint, so a dark-theme reader never sees a white flash.
  // Storage can be refused; the page then follows the system.
  try {
    var theme = localStorage.getItem("neverseen.theme");
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  } catch (e) {}
</script>
<style>{{.Style}}</style>
</head>
<!-- The key is here only when the page was opened with a one-time ticket (settings.go). -->
<body data-control-key="{{.ControlKey}}">
<div id="root"></div>
<script type="module">{{.Script}}</script>
</body>
</html>
