<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2317191e'/%3E%3Cpath d='M12 6.5v11' stroke='%23fff' stroke-width='1.5' stroke-linecap='round'/%3E%3Crect x='4.75' y='9.25' width='5.5' height='5.5' rx='1.25' fill='%23fff'/%3E%3Crect x='13.75' y='9.25' width='5.5' height='5.5' rx='1.25' fill='none' stroke='%23fff' stroke-width='1.6'/%3E%3C/svg%3E" />
    <title>Neverseen console</title>
    <script>
      // Applied before the first paint so a dark-theme reader never sees a white flash.
      // Wrapped: storage can be unavailable (private window, file:// in some browsers).
      try {
        var t = localStorage.getItem("neverseen.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
