version: 2

# The agent for six targets, the icon for the macOS and Windows ones, and no
# packaging cleverness. The install script below unpacks an archive and puts the
# binaries somewhere; anything more elaborate is a second way to install that
# would drift from the first.
#
# The macOS archives carry both binaries and the Linux ones carry only the agent,
# which is not an oversight — but the reason is not the one that used to be written
# here. It said the icon is Cocoa and Linux has no menu bar for it. Only the first
# half is true: in fyne.io/systray, cgo is darwin's alone, and Linux is
# StatusNotifierItem over dbus in pure Go. GOOS=linux CGO_ENABLED=0 builds the tray
# today. What stops it shipping is the desktop: Plasma hosts a StatusNotifierItem
# natively and GNOME needs the AppIndicator extension, so a Linux archive carrying
# the icon would put one on most machines that draws nothing.

project_name: neverseen

before:
  hooks:
    - go mod tidy
    # The release must not be able to carry a detector that fell below its floor.
    # A build that skipped this would ship silently worse masking.
    - go test ./...

builds:
  # The agent, unchanged: pure Go, statically linked, cross-compiled for both
  # platforms from wherever this runs. It has no C dependency and it must keep
  # having none — it is the binary that proxies people's credentials.
  - id: neverseen
    main: ./cmd/neverseen
    binary: neverseen
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      # The version the agent reports about itself. It is a var rather than a
      # const precisely so this works — declared const, the flag is silently
      # inert and every release reports the same string.
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  # The menu bar icon, which is Cocoa and therefore needs cgo. Its own build entry
  # so the requirement stops here: the agent above still builds with CGO_ENABLED=0,
  # and a Cocoa build that broke would cost the icon rather than the release of the
  # masking agent.
  #
  # It is why this repository's release runs on macOS — nothing else has the
  # frameworks this links against. The agent's targets are cross-compiled from
  # there, which pure Go does anywhere.
  - id: neverseen-tray
    main: ./cmd/neverseen-tray
    binary: neverseen-tray
    env:
      - CGO_ENABLED=1
    goos: [darwin]
    goarch: [amd64, arm64]
    overrides:
      # The runners are Apple Silicon, so the Intel build is a cross-compile, and
      # cgo does not take the architecture from GOARCH — it has to be told, or it
      # compiles arm64 objects and the link fails on a mismatch nobody reads.
      - goos: darwin
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - "CC=clang -arch x86_64"
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  # The icon on Windows, which needs no cgo at all: fyne.io/systray speaks win32
  # syscalls there, exactly as it speaks dbus on Linux. Its own build id rather than a
  # goos added to the entry above, because that one is CGO_ENABLED=1 for AppKit and
  # cross-compiling cgo to Windows from a Mac runner is a toolchain nobody wants to
  # own.
  #
  # -H windowsgui, and only here: this binary has no console output to lose, while the
  # agent is a CLI and a GUI-subsystem build of it would print nothing into the
  # terminal somebody ran `neverseen status` in.
  - id: neverseen-tray-windows
    main: ./cmd/neverseen-tray
    binary: neverseen-tray
    env:
      - CGO_ENABLED=0
    goos: [windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -H windowsgui -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    # Zip on Windows, because tar is not something a stock Windows install unpacks by
    # double-clicking and the first step of an installation must not be finding a tool.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE.md
      - THIRD_PARTY_LICENSES
      - NOTICE
      - .env.example
      - install.sh
      - install.ps1

checksums:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^chore:"

release:
  # Source available, not open source: the release notes say so, because somebody
  # will find the binary before they find the licence.
  footer: |
    Neverseen is source available under the Functional Source License
    (FSL-1.1-ALv2): free for any use, including inside a company, but not to
    offer as a competing product or service. Each release becomes Apache 2.0 two
    years after it ships.
