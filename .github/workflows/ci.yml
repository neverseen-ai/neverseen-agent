name: CI

# The default branch of this repository is `main`, and these triggers name it.
# Agent Veil, which this project replaces, had its workflow keyed to `main`
# while its default branch was `master`: the pipeline was green for a year
# because it never ran. If the default branch is ever renamed, rename it here in
# the same commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: make build

      - name: Test with race detector and coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage gate (80%)
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          awk -v c="$total" 'BEGIN { exit (c+0 >= 80) ? 0 : 1 }' || {
            echo "coverage ${total}% is below the 80% gate"
            exit 1
          }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  # The two things a release depends on that the Go suite cannot see: whether the
  # release configuration still builds, and whether the installer is valid shell.
  # Both are only ever exercised at release time otherwise, which is the worst
  # moment to find out.
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser reads tags to work out a version

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check the release configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check

      - name: Build a snapshot release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: build --snapshot --clean

      - name: Check the installer is portable shell
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          sh -n install.sh
          shellcheck --shell=sh install.sh
