name: CI

# The default branch of this repository is `main`, and these triggers name it.
# Agent Veil, which this project replaces, had its workflow keyed to `main`
# while its default branch was `master`: the pipeline was green for a year
# because it never ran. If the default branch is ever renamed, rename it here in
# the same commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: make build

      # The settings page's decisions, which are JavaScript and therefore invisible
      # to the Go suite and its coverage gate. Node is on the runner already and this
      # needs no package: one file, no dependency.
      - name: Test the settings page's decisions
        run: node --test internal/proxy/settings_decisions.test.mjs

      - name: Test with race detector and coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage gate (80%)
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          awk -v c="$total" 'BEGIN { exit (c+0 >= 80) ? 0 : 1 }' || {
            echo "coverage ${total}% is below the 80% gate"
            exit 1
          }

  # Its own job rather than a matrix over `build`, because that job also gates
  # coverage and checks gofmt — one 80% number is a fact about the Go packages and
  # producing it twice on two runners would either double the gate or make it
  # ambiguous which run it came from. What Windows adds is the only thing it can:
  # whether the code runs there at all.
  #
  # It exists ahead of the Windows port rather than after it. The suite is expected
  # to fail here at first, and those failures are the specification: file modes are
  # asserted in several packages and a mode is a no-op on NTFS. A port with no runner
  # rots between releases, invisibly, and the rot is found by whoever downloads it.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # The installer for this platform, parsed rather than run. There is no runner
      # anywhere else that can parse it, and a script that is only ever read at the
      # moment somebody installs is one whose syntax error is found by them.
      - name: Check the installer parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { $_.Message }; exit 1 }
          Write-Host "install.ps1 parses"

  # Every target the release names, built from one runner. Cheap, and it is what
  # catches a build tag that excluded every platform or a package that quietly
  # stopped cross-compiling — neither of which any single-platform job can see.
  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the agent for every target
        run: |
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              echo "--- $os/$arch"
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -o /dev/null ./cmd/neverseen
            done
          done

      # The icon is cgo on darwin alone; everywhere else it is pure Go. Building it
      # for Linux and Windows here is what keeps that true — and what would have
      # caught the claim, written in four places in this tree for a long time, that
      # it could not be built off macOS at all.
      - name: Build the icon where it needs no cgo
        run: |
          GOOS=linux CGO_ENABLED=0 go build -o /dev/null ./cmd/neverseen-tray
          GOOS=windows CGO_ENABLED=0 go build -o /dev/null ./cmd/neverseen-tray

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  # The two things a release depends on that the Go suite cannot see: whether the
  # release configuration still builds, and whether the installer is valid shell.
  # Both are only ever exercised at release time otherwise, which is the worst
  # moment to find out.
  #
  # On macOS, and that is forced rather than chosen: neverseen-tray puts an icon
  # in the menu bar through Cocoa, so it needs cgo and the frameworks it links
  # against, which exist on no other runner. The agent itself is pure Go and is
  # cross-compiled from here for both platforms, as it always was — the Mac is
  # needed for the icon, not for the thing that does the masking.
  distribution:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser reads tags to work out a version

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check the release configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check

      # `release`, not `build`, and that is the whole point of this step. `build`
      # stops once the binaries are compiled and never reaches `archives` or
      # `checksum`, so the two steps install.sh actually depends on were the only
      # ones CI could not see. Both broke there and both shipped: `checksums:` was
      # written where goreleaser wants `checksum:`, and the archives carried a
      # different number of binaries per platform, which goreleaser refuses. The
      # first release failed on the second of those, on a tag, where the failure is
      # a published tag with nothing attached to it.
      - name: Build a snapshot release, archives and checksums included
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean --skip=publish

  # Its own job, on Linux, because shellcheck is installed with apt-get and the
  # release job no longer runs anywhere that has it.
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the installer is portable shell
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          sh -n install.sh
          shellcheck --shell=sh install.sh

  # Its own job, and the coverage gate above is the reason: that 80% is a fact
  # about the Go packages, and folding a TypeScript bundle into the same run would
  # either dilute the number or need a second gate pretending to be the first one.
  # This job builds the extension on a clean checkout, which is the only way to
  # find out that a file was never committed.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Build, typecheck and test the extension
        working-directory: extension
        # No browser here. This job builds and unit-tests; the end-to-end job below
        # is the one that needs a Chrome, and downloading 150 MB into a job that
        # never launches it is a minute added to every commit for nothing.
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci
          npm run check

  # The contract between the extension and the agent, replayed against a real
  # agent on every commit that touches either side.
  #
  # A job of its own rather than a line in the Go suite, because it is the only
  # thing here that fails when *neither* side is broken: the two halves each pass
  # their own tests and disagree about the wire. Running it where its name is
  # visible is what makes that diagnosis readable at a glance.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: The agent's half — the real detector answers the recorded responses
        run: go test ./internal/proxy/ -run 'TestExtensionContract|TestContractCovers' -v

      - name: The extension's half — its client sends the recorded requests
        working-directory: extension
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci
          node --test --experimental-strip-types test/contract.test.ts

      - name: The recorded exchanges are committed, not regenerated in CI
        run: git diff --exit-code extension/testdata/contract.json

  # The one test with nothing stubbed: the built extension, in a real Chrome, in
  # front of a page served on claude.ai's own origin, talking to an agent built
  # from this commit.
  #
  # Separate from the extension job because it is the only one that needs a
  # browser downloaded, a Go binary built and a certificate minted, and because
  # its failures mean something different: the two unit suites can both be green
  # while the seam between them is broken, and this is what notices.
  extension-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Build the agent this test runs against
        run: make build

      - name: Build the extension this test loads
        working-directory: extension
        run: |
          npm ci
          npx puppeteer browsers install chrome
          npm run build

      - name: A value typed into a page, through the extension, through the agent
        working-directory: extension
        run: npm run e2e
